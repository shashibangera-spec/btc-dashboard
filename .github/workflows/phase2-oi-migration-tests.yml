name: Phase 2 OI migration offline tests

on:
  push:
    branches:
      - "feature/phase2-oi-migration"
    paths:
      - ".github/workflows/phase2-oi-migration-tests.yml"
      - "test_phase2_oi_migration.py"
      - "phase2_oi_migration.py"
      - "phase2_oi_migration_adapter.py"

permissions:
  contents: read

concurrency:
  group: phase2-oi-migration-offline-tests
  cancel-in-progress: false

jobs:
  phase2-oi-migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 2 implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify checked-out commit
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked-out commit: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          CALC_BLOB="$(git rev-parse HEAD:phase2_oi_migration.py)"
          ADAPTER_BLOB="$(git rev-parse HEAD:phase2_oi_migration_adapter.py)"
          echo "Calculation module blob: $CALC_BLOB"
          echo "Adapter module blob: $ADAPTER_BLOB"
          test "$CALC_BLOB" = "b6cb6e7bbde97a3a5dbaf27c70b412b8469d79fd"
          test "$ADAPTER_BLOB" = "20cb95dacd5bee80081bec3146fd4a08f2957015"

      - name: Install offline test dependencies
        run: python -m pip install "pandas>=2.1.0" pytest

      - name: Run Phase 2 OI migration tests
        run: python -m pytest -q test_phase2_oi_migration.py

      - name: Compile Phase 2 OI migration modules
        run: python -m py_compile phase2_oi_migration.py phase2_oi_migration_adapter.py test_phase2_oi_migration.py
