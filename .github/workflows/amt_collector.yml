name: BTC AMT Historical Collector

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: btc-amt-collector
  cancel-in-progress: false

jobs:
  collect-amt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests supabase

      - name: Run AMT collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python amt_collector.py

      # Research-only sidecar: run after a successful AMT write. A shadow
      # failure must never block Futures/Options collection or AMT success.
      - name: Run auction deterioration shadow monitor
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python shadow_monitor.py
