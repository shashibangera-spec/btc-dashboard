name: BTC AMT Historical Collector

on:
  schedule:
    # Runs at 10 and 40 minutes past the hour (UTC)
    - cron: '10,40 * * * *'

  workflow_dispatch:

concurrency:
  group: btc-amt-collector
  cancel-in-progress: false

jobs:
  collect-amt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests supabase

      - name: Run AMT collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python amt_collector.py
