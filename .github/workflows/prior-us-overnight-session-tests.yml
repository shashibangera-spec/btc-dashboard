name: Prior US Overnight Session Tests

on:
  push:
    branches:
      - feature/prior-us-overnight-session-row
    paths:
      - "btc_live_dashboard.py"
      - "tests/test_prior_us_overnight_session.py"
      - ".github/workflows/prior-us-overnight-session-tests.yml"

permissions:
  contents: read

jobs:
  session-tests:
    name: prior US overnight session regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4
        with:
          ref: feature/prior-us-overnight-session-row

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26.0" "pandas>=2.1.0"

      - name: Run focused session tests
        run: python -m unittest discover -s tests -p 'test_prior_us_overnight_session.py' -v
