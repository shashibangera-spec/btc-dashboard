name: Raw Options Retention Tests

on:
  pull_request:
    paths:
      - "retention_cron.py"
      - "test_retention_cron.py"
      - ".github/workflows/retention-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]" supabase

      - name: Run retention regression tests
        run: pytest -q test_retention_cron.py
