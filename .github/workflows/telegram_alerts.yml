name: BTC High-Signal Telegram Alerts

on:
  workflow_call:
    inputs:
      test_mode:
        description: "Send a test Telegram message"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test Telegram message"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# This fixed group is shared by reusable Coordinator calls and manual runs.
# Queue overlapping evaluations instead of cancelling an active delivery.
concurrency:
  group: btc-telegram-alerts
  cancel-in-progress: false

jobs:
  evaluate-and-send:
    name: Evaluate Structural Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "supabase>=2.0.0"

      - name: Evaluate and send Telegram alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python telegram_alerts.py
