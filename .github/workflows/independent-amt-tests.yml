name: Independent Python AMT Tests

on:
  pull_request:
    paths:
      - "independent_amt_engine.py"
      - "tests/test_independent_amt_engine.py"
      - ".github/workflows/independent-amt-tests.yml"
  push:
    branches:
      - independent-python-amt-engine
    paths:
      - "independent_amt_engine.py"
      - "tests/test_independent_amt_engine.py"
      - ".github/workflows/independent-amt-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-amt-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_independent_amt_engine.py" -v
