name: BTC Market Reaction Analyzer

on:
  schedule:
    - cron: "0 7 * * *" # 12:30 PM IST
  workflow_dispatch:

concurrency:
  group: btc-market-reaction-analyzer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze-reactions:
    name: Analyze completed signal reactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.0.0"

      - name: Run Market Reaction Analyzer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python reaction_analyzer.py
