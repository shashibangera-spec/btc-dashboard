name: Phase 2 GEX attribution tests

on:
  pull_request:
    paths:
      - "gex_attribution.py"
      - "options_collector.py"
      - "test_gex_attribution.py"
      - "migrations/20261119_create_gex_strike_attribution.sql"
      - ".github/workflows/phase-2-gex-attribution-tests.yml"
  push:
    branches:
      - "phase-2-gex-attribution"
    paths:
      - "gex_attribution.py"
      - "options_collector.py"
      - "test_gex_attribution.py"
      - "migrations/20261119_create_gex_strike_attribution.sql"
      - ".github/workflows/phase-2-gex-attribution-tests.yml"

permissions:
  contents: read

jobs:
  gex-attribution-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run Phase 2 GEX attribution regression tests
        run: pytest -q test_gex_attribution.py
      - name: Compile collector and attribution modules
        run: python -m py_compile options_collector.py gex_attribution.py
