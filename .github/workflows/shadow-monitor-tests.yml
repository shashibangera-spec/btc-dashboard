name: Auction Deterioration Shadow Tests

on:
  pull_request:
    paths:
      - "shadow_monitor.py"
      - "test_shadow_monitor.py"
      - ".github/workflows/shadow-monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-monitor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "supabase>=2.0.0"

      - name: Run shadow monitor regression tests
        run: pytest -q test_shadow_monitor.py
