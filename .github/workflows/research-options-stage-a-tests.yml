name: Research Dashboard Stage A tests

on:
  pull_request:
    paths:
      - "btc_live_research_dashboard.py"
      - "research_options_adapter.py"
      - "test_research_options_stage_a.py"
      - "test_research_options_stage_b.py"
      - "test_research_options_stage_c.py"
      - "options_filters.py"
      - ".github/workflows/research-options-stage-a-tests.yml"
  push:
    branches:
      - main
      - "feature/research-dashboard-oi-map-raw-table-stage-c"
    paths:
      - "btc_live_research_dashboard.py"
      - "research_options_adapter.py"
      - "test_research_options_stage_a.py"
      - "test_research_options_stage_b.py"
      - "test_research_options_stage_c.py"
      - "options_filters.py"
      - ".github/workflows/research-options-stage-a-tests.yml"

permissions:
  contents: read

jobs:
  stage-a-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1.0" numpy pytest
      - name: Run Stage A, Stage B and Stage C regression tests
        run: pytest -q test_research_options_stage_a.py test_research_options_stage_b.py test_research_options_stage_c.py test_options_filters.py
      - name: Compile Research Dashboard modules
        run: python -m py_compile btc_live_research_dashboard.py research_options_adapter.py options_filters.py
