name: Data Integrity and Telegram Outbox Tests

on:
  pull_request:
    paths:
      - "telegram_alerts.py"
      - "collector.py"
      - "futures_positioning.py"
      - "test_gex_notifier.py"
      - "test_amt_profile_initialization.py"
      - "test_futures_integrity.py"
      - "test_telegram_outbox.py"
      - "test_telegram_outbox.py"
      - ".github/workflows/data-integrity-tests.yml"
  push:
    branches:
      - main
      - fix/amt-profile-initialization-alert
    paths:
      - "telegram_alerts.py"
      - "collector.py"
      - "futures_positioning.py"
      - "test_gex_notifier.py"
      - "test_amt_profile_initialization.py"
      - "test_futures_integrity.py"
      - ".github/workflows/data-integrity-tests.yml"

permissions:
  contents: read

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Run notifier, AMT initialization and Futures integrity tests
        run: pytest -q test_gex_notifier.py test_amt_profile_initialization.py test_futures_integrity.py test_telegram_outbox.py
      - name: Compile changed production modules
        run: python -m py_compile telegram_alerts.py collector.py futures_positioning.py
