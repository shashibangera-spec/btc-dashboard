name: Research-only BTC AMT Historical Replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-only-btc-amt-historical-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout merged replay implementation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.0.0" "pandas>=2.1.0" "numpy>=1.26.0"

      - name: Run offline replay-input and state-machine tests
        run: |
          python -m pytest -q test_pine_state_machine.py test_pine_dashboard_integration.py test_replay_input_validation.py
          python -m py_compile pine_state_machine.py replay_pine_state_machine.py

      - name: Execute read-only historical replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python replay_pine_state_machine.py --output-dir replay_output

      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: btc-amt-historical-replay-12-to-16-nov-2026
          path: replay_output/
          if-no-files-found: error
          retention-days: 30
