name: Pine state machine and dashboard integration tests

on:
  pull_request:
    paths:
      - "pine_state_machine.py"
      - "test_pine_state_machine.py"
      - "test_pine_dashboard_integration.py"
      - "replay_pine_state_machine.py"
      - "test_replay_input_validation.py"
      - "btc_live_dashboard.py"
      - ".github/workflows/pine-state-machine-tests.yml"
  push:
    branches:
      - main
    paths:
      - "pine_state_machine.py"
      - "test_pine_state_machine.py"
      - "test_pine_dashboard_integration.py"
      - "btc_live_dashboard.py"
      - ".github/workflows/pine-state-machine-tests.yml"

permissions:
  contents: read

jobs:
  pine-state-machine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1.0" "numpy>=1.26.0" pytest
      - name: Run Pine state-machine and dashboard integration tests
        run: pytest -q test_pine_state_machine.py test_pine_dashboard_integration.py test_replay_input_validation.py
      - name: Compile dashboard and state-machine modules
        run: python -m py_compile pine_state_machine.py replay_pine_state_machine.py btc_live_dashboard.py
