name: BTC Options Archive and Retention

on:
  schedule:
    # 06:17 IST (00:47 UTC), shifted away from the top of the hour.
    - cron: "47 0 * * *"

  workflow_dispatch:

concurrency:
  group: btc-options-archive-retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-and-retain:
    name: Archive and Retain BTC Options Data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout main application repository
      - name: Checkout btc-dashboard
        uses: actions/checkout@v4
        with:
          repository: shashibangera-spec/btc-dashboard
          ref: main
          path: btc-dashboard
          persist-credentials: false

      # 2. Checkout private archive repository
      - name: Checkout btc-data-archive
        uses: actions/checkout@v4
        with:
          repository: shashibangera-spec/btc-data-archive
          ref: main
          path: btc_data_archive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # 3. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]" supabase pandas

      # 5. Freeze one cutoff for both archive export and retention preflight.
      - name: Establish shared retention cutoff
        working-directory: btc-dashboard
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os

          cutoff = (datetime.now(timezone.utc) - timedelta(days=3)).isoformat()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ARCHIVE_RETENTION_CUTOFF_UTC={cutoff}\n")
          print(f"SHARED_RETENTION_CUTOFF_UTC={cutoff}")
          PY

      # 6. Generate newly eligible archives
      - name: Archive options snapshots
        working-directory: btc-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python archive_options_snapshots.py \
            --older-than-days 3 \
            --cutoff-utc "$ARCHIVE_RETENTION_CUTOFF_UTC" \
            --output ../btc_data_archive

      # 7. Publish archives BEFORE database deletion
      - name: Commit and push archive files
        working-directory: btc_data_archive
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          
          git add --all
          
          if git diff --cached --quiet; then
            echo "No new archive files or manifest changes."
          else
            git commit -m "Archive BTC options snapshots $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "Archive repository updated successfully."
          fi

      # 7. Verify archive checksums and execute retention
      - name: Verify archives and execute retention
        working-directory: btc-dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Check if the manifest exists before running retention
          if [ -f ../btc_data_archive/archive_manifest.csv ]; then
            echo "Manifest found. Running retention..."
            python retention_cron.py --execute --cutoff-utc "$ARCHIVE_RETENTION_CUTOFF_UTC" --archive-dir ../btc_data_archive
          else
            echo "No archive manifest found (no data older than 3 days). Skipping retention."
          fi

      # 8. Log database size and run routine vacuum/analyze after retention.
      - name: Measure database size before vacuum
        working-directory: btc-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as connection:
              size = connection.execute(
                  "SELECT pg_database_size(current_database())"
              ).fetchone()[0]
          mb = size / (1024 * 1024)
          print(f"DATABASE_SIZE_BEFORE_VACUUM_BYTES={size}")
          print(f"DATABASE_SIZE_BEFORE_VACUUM_MB={mb:.2f}")
          print(f"STORAGE_TARGET_300_MB={'BREACHED' if mb >= 300 else 'OK'}")
          print(f"STORAGE_WARNING_350_MB={'BREACHED' if mb >= 350 else 'OK'}")
          print(f"STORAGE_EMERGENCY_400_MB={'BREACHED' if mb >= 400 else 'OK'}")
          PY

      - name: Vacuum and analyze options snapshots
        working-directory: btc-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          # VACUUM cannot run inside a transaction block.
          with psycopg.connect(
              os.environ["DATABASE_URL"],
              connect_timeout=20,
              autocommit=True,
          ) as connection:
              connection.execute("VACUUM (VERBOSE, ANALYZE) options_oi_snapshots;")
          print("Routine VACUUM (VERBOSE, ANALYZE) completed.")
          PY

      - name: Measure database size after vacuum
        working-directory: btc-dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as connection:
              size = connection.execute(
                  "SELECT pg_database_size(current_database())"
              ).fetchone()[0]
          mb = size / (1024 * 1024)
          print(f"DATABASE_SIZE_AFTER_VACUUM_BYTES={size}")
          print(f"DATABASE_SIZE_AFTER_VACUUM_MB={mb:.2f}")
          print(f"STORAGE_TARGET_300_MB={'BREACHED' if mb >= 300 else 'OK'}")
          print(f"STORAGE_WARNING_350_MB={'BREACHED' if mb >= 350 else 'OK'}")
          print(f"STORAGE_EMERGENCY_400_MB={'BREACHED' if mb >= 400 else 'OK'}")
          PY
