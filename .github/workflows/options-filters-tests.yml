name: Options filters backend tests

on:
  pull_request:
    paths:
      - "options_filters.py"
      - "btc_live_dashboard.py"
      - "btc_live_research_dashboard.py"
      - "test_options_filters.py"
      - "test_fast_dashboard_options_ui.py"
      - "test_research_options_stage_b.py"
      - ".github/workflows/options-filters-tests.yml"
  push:
    branches:
      - main
      - "feature/options-filters-backend"
    paths:
      - "options_filters.py"
      - "test_options_filters.py"
      - ".github/workflows/options-filters-tests.yml"

permissions:
  contents: read

jobs:
  options-filters-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1.0" pytest
      - name: Run offline options backend and dashboard regression tests
        run: pytest -q test_options_filters.py test_fast_dashboard_options_ui.py test_research_options_stage_b.py
      - name: Compile changed production modules
        run: python -m py_compile options_filters.py btc_live_dashboard.py btc_live_research_dashboard.py
