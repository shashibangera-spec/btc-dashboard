name: Options filters backend tests

on:
  pull_request:
    paths:
      - "options_filters.py"
      - "test_options_filters.py"
      - ".github/workflows/options-filters-tests.yml"
  push:
    branches:
      - main
      - "feature/options-filters-backend"
    paths:
      - "options_filters.py"
      - "test_options_filters.py"
      - ".github/workflows/options-filters-tests.yml"

permissions:
  contents: read

jobs:
  options-filters-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1.0" pytest
      - name: Run offline options filter tests
        run: pytest -q test_options_filters.py
