name: GEX notifier unit tests

on:
  pull_request:
    paths:
      - "telegram_alerts.py"
      - "signal_detector.py"
      - "btc_live_dashboard.py"
      - "test_gex_notifier.py"
      - "test_oi_shock_context.py"
      - ".github/workflows/gex-notifier-tests.yml"
  push:
    branches:
      - main
      - "fix/gex-telegram-journal-outbox"
    paths:
      - "telegram_alerts.py"
      - "signal_detector.py"
      - "btc_live_dashboard.py"
      - "test_gex_notifier.py"
      - "test_oi_shock_context.py"
      - ".github/workflows/gex-notifier-tests.yml"

permissions:
  contents: read

jobs:
  gex-notifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
      - name: Run offline OI context and GEX notifier regression tests
        run: pytest -q test_gex_notifier.py test_oi_shock_context.py
      - name: Compile production modules
        run: python -m py_compile signal_detector.py telegram_alerts.py btc_live_dashboard.py
